<section class="band band--alt" id="idea" aria-labelledby="idea-title">
  <div class="wrap">
    <h2 id="idea-title" class="h2">A step is done when the proof is in</h2>
    <p class="lede">Code that looks right can still be wrong. So Ratchet doesn't count a step as done when the code is written. It waits for the proof too: the test results, the screen check and the review. A step and its proof together are called a checkpoint.</p>

    <figure class="eq reveal" data-eq aria-label="Done equals code plus proof">
      <div class="eq__head">
        <p class="eq__title">Done means code plus proof. <em>Your agent writes the code. Ratchet collects the proof.</em></p>
        <button class="pill" type="button" data-eq-replay>{{ICON_REPLAY}}Replay</button>
      </div>
      <div class="eq__row">
        <div class="eq__card" data-eq-step="1">
          <span class="eq__icon">{{ICON_CODE}}</span>
          <div><h3>Code</h3><p>Written by your agent</p></div>
        </div>
        <span class="eq__op" data-eq-step="2" aria-hidden="true">+</span>
        <div class="eq__card" data-eq-step="2">
          <span class="eq__icon eq__icon--gates" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <div><h3>Proof</h3><p>Four gates, checked by Ratchet</p></div>
        </div>
      </div>
      <span class="eq__op eq__op--eq" data-eq-step="3" aria-hidden="true">=</span>
      <div class="eq__result" data-eq-step="3">
        <span class="eq__orbit" aria-hidden="true"><svg viewBox="0 0 64 64">{{MARK}}</svg></span>
        <div><h3>Locked checkpoint</h3><p>One git commit</p></div>
      </div>
      <div class="eq__inner" data-eq-step="4">
        <p class="mono-k">Around every step</p>
        <div class="eq__flow">
          <p><b>01</b>A gate fails <span aria-hidden="true">→</span> the agent fixes it and tries again</p>
          <p><b>02</b>All gates pass <span aria-hidden="true">→</span> the checkpoint is committed and the next one starts</p>
          <p><b>03</b>Out of tries <span aria-hidden="true">→</span> the run stops and asks you</p>
        </div>
        <p class="eq__becomes" aria-hidden="true">Repeated for every checkpoint ↓</p>
        <p class="eq__final"><em>A finished feature</em><span>every step tested, reviewed and saved, then approved by you</span></p>
      </div>
    </figure>
  </div>
</section>
