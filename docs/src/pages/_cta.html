<!-- ============ CTA ============ -->
<section class="cta" aria-labelledby="cta-title">
  <div class="wrap cta__card">
    <svg class="cta__mark" viewBox="0 0 64 64" aria-hidden="true">{{MARK}}</svg>
    <h2 id="cta-title" class="cta__title">Know it works <em>before you merge.</em></h2>
    <p class="lede">Paste one prompt to install. Describe a feature to build it.</p>
    <div class="hero__ctas">
      <button class="btn btn--primary" type="button" data-copy="{{INSTALL_PROMPT}}">{{ICON_COPY}}<span data-copy-label>Copy the install prompt</span></button>
      <a class="btn btn--ghost" href="https://github.com/rahilp/Ratchet-Loop" rel="noopener">{{ICON_CODE}}Read the docs on GitHub</a>
    </div>
  </div>
</section>
