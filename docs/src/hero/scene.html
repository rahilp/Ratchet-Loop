<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#07080a;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1920, H = +P.get('h') || 1080;
const FPS = 30, LOOP = 8, FRAMES = FPS * LOOP;      // 8 s loop
const CLICKS = 4, TEETH = 24, PITCH = Math.PI * 2 / TEETH;
const TAU = Math.PI * 2;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060709);
scene.fog = new THREE.FogExp2(0x060709, 0.045);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.42;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);

// ---------- procedural textures ----------
function brushedTexture(size = 1024) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#8a8a8a'; g.fillRect(0, 0, size, size);
  // concentric lathe marks (radial brushing)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let r = 4; r < size * 0.72; r += 0.7) {
    const v = 110 + rnd() * 70;
    g.strokeStyle = `rgba(${v},${v},${v},${0.15 + rnd() * 0.25})`;
    g.lineWidth = 0.6 + rnd();
    g.beginPath(); g.arc(size / 2, size / 2, r, 0, TAU); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.NoColorSpace;
  return t;
}
function glowTexture(inner = 'rgba(255,255,255,1)', size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, inner); gr.addColorStop(0.25, inner.replace(/[\d.]+\)$/, '0.35)'));
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

const brushed = brushedTexture();
const steel = new THREE.MeshPhysicalMaterial({
  color: 0xa3a9b1, metalness: 1, roughness: 0.3,
});
// lathe brushing as a function of radius only, so the wheel is exactly symmetric under a tooth step
steel.onBeforeCompile = sh => {
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec2 vP;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvP = position.xy;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec2 vP;')
    .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nfloat ring = fract(sin(floor(length(vP) * 380.0) * 12.9898) * 43758.5453);\nroughnessFactor = clamp(roughnessFactor * (0.72 + 0.56 * ring), 0.05, 1.0);');
};
const darkSteel = new THREE.MeshPhysicalMaterial({ color: 0x3a3e45, metalness: 0.9, roughness: 0.55 });
const blued = new THREE.MeshPhysicalMaterial({ color: 0x232833, metalness: 1, roughness: 0.38, clearcoat: 0.6 });
const brass = new THREE.MeshPhysicalMaterial({ color: 0xc8924a, metalness: 1, roughness: 0.3 });

// ---------- ratchet wheel ----------
const R_ROOT = 1.62, R_TIP = 2.0;
function wheelShape() {
  const s = new THREE.Shape();
  // sawtooth: radius ramps root->tip across the pitch, then drops vertically
  const STEPS = 10;
  for (let k = 0; k < TEETH; k++) {
    const a0 = k * PITCH;
    for (let j = 0; j <= STEPS; j++) {
      const f = j / STEPS;
      const r = R_ROOT + (R_TIP - R_ROOT) * Math.pow(f, 0.85);
      const a = a0 + f * PITCH * 0.94;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      (k === 0 && j === 0) ? s.moveTo(x, y) : s.lineTo(x, y);
    }
    const a1 = a0 + PITCH * 0.94, a2 = a0 + PITCH;
    s.lineTo(Math.cos(a1) * R_TIP * 0.995, Math.sin(a1) * R_TIP * 0.995);
    if (k < TEETH - 1) s.lineTo(Math.cos(a2) * R_ROOT, Math.sin(a2) * R_ROOT);
  }
  s.closePath();
  // lightening holes
  for (let k = 0; k < 6; k++) {
    const h = new THREE.Path(), c = k * TAU / 6;
    h.absarc(Math.cos(c) * 0.98, Math.sin(c) * 0.98, 0.27, c, c + TAU, true);
    s.holes.push(h);
  }
  const bore = new THREE.Path(); bore.absarc(0, 0, 0.26, 0, TAU, true);  // 48 divisions: 60° symmetric s.holes.push(bore);
  return s;
}
const wheel = new THREE.Group();
{
  const geo = new THREE.ExtrudeGeometry(wheelShape(), {
    depth: 0.34, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.018, bevelSegments: 3, curveSegments: 48,
  });
  geo.translate(0, 0, -0.17);
  // planar UVs for the lathe texture
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / 4.4 + 0.5, pos.getY(i) / 4.4 + 0.5);
  const m = new THREE.Mesh(geo, steel); m.castShadow = m.receiveShadow = true; wheel.add(m);
  // hub
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.52, 72), blued);
  hub.rotation.x = Math.PI / 2; hub.castShadow = true; wheel.add(hub);
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.7, 48), steel);
  axle.rotation.x = Math.PI / 2; wheel.add(axle);
  // bolt circle
  for (let k = 0; k < 6; k++) {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.56, 6), darkSteel);
    const a = k * TAU / 6 + TAU / 12;
    b.position.set(Math.cos(a) * 0.38, Math.sin(a) * 0.38, 0); b.rotation.x = Math.PI / 2; wheel.add(b);
  }
  // engraved ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.012, 8, 240), darkSteel);
  ring.position.z = 0.2; wheel.add(ring);
}
// checkpoint studs: one per tooth, they heat up as each tooth locks
const studMats = [], studs = [];
for (let k = 0; k < TEETH; k++) {
  const mat = new THREE.MeshPhysicalMaterial({ color: 0x2a2d33, metalness: 0.7, roughness: 0.35, emissive: 0xff5a1f, emissiveIntensity: 0 });
  const st = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.03, 24), mat);
  const a = k * PITCH + PITCH * 0.55;
  st.position.set(Math.cos(a) * 1.5, Math.sin(a) * 1.5, 0.205);
  st.rotation.x = Math.PI / 2;
  wheel.add(st); studMats.push(mat); studs.push(a);
}
scene.add(wheel);

// ---------- pawl ----------
// pivot sits up and to the right of the wheel; tip rests in the tooth at world angle PAWL_A
const PAWL_A = Math.PI * 0.30;
const TIP0 = new THREE.Vector2(Math.cos(PAWL_A) * R_ROOT, Math.sin(PAWL_A) * R_ROOT);
const TAN = new THREE.Vector2(Math.sin(PAWL_A), -Math.cos(PAWL_A)), RAD = new THREE.Vector2(Math.cos(PAWL_A), Math.sin(PAWL_A));
const pivot = new THREE.Vector3(TIP0.x - TAN.x * 1.35 + RAD.x * 0.38, TIP0.y - TAN.y * 1.35 + RAD.y * 0.38, 0);
const ROT0 = (PAWL_A % PITCH) - 0.012;
const pawl = new THREE.Group(); pawl.position.copy(pivot);
let pawlLen;
{
  const tip = new THREE.Vector3(Math.cos(PAWL_A) * R_ROOT, Math.sin(PAWL_A) * R_ROOT, 0).sub(pivot);
  pawlLen = tip.length();
  const s = new THREE.Shape();
  s.moveTo(0, 0.19);
  s.lineTo(pawlLen * 0.75, 0.12);
  s.lineTo(pawlLen + 0.02, 0.0);
  s.lineTo(pawlLen * 0.82, -0.12);
  s.lineTo(0, -0.19);
  s.absarc(0, 0, 0.19, -Math.PI / 2, Math.PI / 2, true);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.22, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.015, bevelSegments: 3 });
  g.translate(0, 0, -0.11);
  const pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / 4 + 0.5, pos.getY(i) / 4 + 0.5);
  const arm = new THREE.Mesh(g, steel); arm.castShadow = true;
  const armHolder = new THREE.Group(); armHolder.add(arm);
  armHolder.rotation.z = Math.atan2(tip.y, tip.x);
  pawl.add(armHolder);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5, 40), brass);
  pin.rotation.x = Math.PI / 2; pawl.add(pin);
}
scene.add(pawl);
// pawl spring (helix)
{
  const pts = [];
  for (let i = 0; i <= 1200; i++) { const t = i / 1200; pts.push(new THREE.Vector3(Math.cos(t * TAU * 30) * 0.07, t * 3.2, Math.sin(t * TAU * 30) * 0.07)); }
  const spring = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 2400, 0.012, 8), brass);
  spring.position.set(pivot.x + 0.25, pivot.y + 0.12, 0.0); spring.rotation.z = 0.3;
  scene.add(spring);
}

// ---------- backplate + secondary gear (depth) ----------
{
  const plate = new THREE.Mesh(new THREE.BoxGeometry(40, 30, 0.2), new THREE.MeshPhysicalMaterial({ color: 0x15171b, metalness: 0.6, roughness: 0.7 }));
  plate.position.set(0.5, 0, -0.6); plate.receiveShadow = true; scene.add(plate);
  // engraved grid lines on plate
  const lm = new THREE.LineBasicMaterial({ color: 0x2a2e36, transparent: true, opacity: 0.6 });
  const lg = new THREE.BufferGeometry(); const v = [];
  for (let x = -6; x <= 7; x += 0.5) v.push(x, -4.5, -0.49, x, 4.5, -0.49);
  for (let y = -4.5; y <= 4.5; y += 0.5) v.push(-6.5, y, -0.49, 7.5, y, -0.49);
  lg.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  scene.add(new THREE.LineSegments(lg, lm));
}
const gear2 = new THREE.Group();
{
  const s = new THREE.Shape(); const N = 14, r1 = 0.9, r2 = 1.05;
  for (let i = 0; i < N * 4; i++) {
    const a = i / (N * 4) * TAU, r = (i % 4 < 2) ? r2 : r1;
    i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const hole = new THREE.Path(); hole.absarc(0, 0, 0.25, 0, TAU, true); s.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.18, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.012, bevelSegments: 2 });
  const m = new THREE.Mesh(g, darkSteel); m.castShadow = true; gear2.add(m);
}
gear2.position.set(-2.55, -1.55, -0.42); scene.add(gear2);

// ---------- lights ----------
const key = new THREE.SpotLight(0xffc896, 420, 40, 0.95, 1.0, 1.6);
key.position.set(5.5, 6, 6); key.target.position.set(0.6, 0.6, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.radius = 4;
scene.add(key, key.target);
const rim = new THREE.SpotLight(0x6fa8ff, 120, 40, 0.9, 1.0, 1.6);
rim.position.set(-5.5, -1.5, -0.7); rim.target.position.set(0, 0, 0); scene.add(rim, rim.target);
const fill = new THREE.PointLight(0xff6a2a, 0, 6, 2); scene.add(fill);   // click flash
scene.add(new THREE.AmbientLight(0x1a1d24, 0.4));
const under = new THREE.PointLight(0xff8a4a, 14, 9, 2); under.position.set(1.5, -3.2, 3.2); scene.add(under);

// flash sprite at the contact point
const contact = new THREE.Vector3(Math.cos(PAWL_A) * (R_ROOT + 0.06), Math.sin(PAWL_A) * (R_ROOT + 0.06), 0.24);
const flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('rgba(255,140,60,1)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
flash.position.copy(contact); flash.scale.setScalar(0.9); scene.add(flash);
fill.position.copy(contact).add(new THREE.Vector3(0.2, 0.2, 0.5));

// haze cards
const haze = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('rgba(255,170,110,0.5)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.16 }));
haze.position.set(2.6, 2.8, -0.3); haze.scale.set(9, 9, 1); scene.add(haze);
const haze2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture('rgba(110,160,255,0.5)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.09 }));
haze2.position.set(-3.5, -1, -0.4); haze2.scale.set(8, 8, 1); scene.add(haze2);

// dust (periodic motion so the loop is seamless)
const DUST = 900;
const dustGeo = new THREE.BufferGeometry();
const dustBase = [], dustPos = new Float32Array(DUST * 3);
{ let s = 11; const r = () => (s = (s * 48271) % 2147483647) / 2147483647;
  for (let i = 0; i < DUST; i++) dustBase.push([ (r() - 0.4) * 11, (r() - 0.5) * 7, r() * 5 - 0.3, r() * TAU, 0.05 + r() * 0.25, 1 + Math.floor(r() * 2)]); }
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ map: glowTexture('rgba(255,225,190,1)', 64), size: 0.035, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(dust);

// sparks: deterministic burst per click
const SPARKS = 60;
const sparkGeo = new THREE.BufferGeometry();
const sparkPos = new Float32Array(SPARKS * 2 * 3);
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
const sparkCol = new Float32Array(SPARKS * 2 * 3);
sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));
const sparks = new THREE.LineSegments(sparkGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(sparks);
const sparkDir = []; { let s = 5; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < SPARKS; i++) { const a = PAWL_A + 0.35 + (r() - 0.5) * 1.3; const v = 1.4 + r() * 2.8; sparkDir.push([Math.cos(a) * v, Math.sin(a) * v, 0.4 + r() * 1.4, 0.18 + r() * 0.32]); } }

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 9.2, aperture: 0.0016, maxblur: 0.006 });
composer.addPass(bokeh);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.6, 0.82));
composer.addPass(new OutputPass());

// ---------- motion ----------
const easeOutBack = (x, s = 1.2) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = x => x * x * (3 - 2 * x);
const CYCLE = LOOP / CLICKS; // 2 s per click
// wheel advances one tooth per cycle: wind (0.15..0.78) then lock at 0.78 with a tiny settle
function wheelAngle(t) {
  const c = Math.floor(t / CYCLE), f = (t % CYCLE) / CYCLE;
  let p;
  if (f < 0.12) p = 0;
  else if (f < 0.78) p = smooth((f - 0.12) / 0.66) * 1.0;
  else p = 1;
  return ROT0 - (c + p) * PITCH;        // clockwise
}
function pawlLift(t) {
  // pawl tip radius above the root, read off the sawtooth under it
  const f = (t % CYCLE) / CYCLE;
  if (f < 0.12) return 0;
  if (f < 0.78) { const p = smooth((f - 0.12) / 0.66); const h = R_TIP - R_ROOT; return p < 0.94 ? Math.pow(p / 0.94, 0.85) * h : h * (1 - (p - 0.94) / 0.06); }
  // fell off the edge: snap with a small bounce
  const k = (f - 0.78) / 0.22;
  return Math.abs(Math.sin(k * 9)) * Math.exp(-k * 7) * 0.05;
}
function sinceClick(t) { const f = (t % CYCLE) / CYCLE; return f >= 0.78 ? (f - 0.78) * CYCLE : (f + 0.22) * CYCLE; }

window.renderFrame = (i) => {
  const t = i / FPS, ph = t / LOOP * TAU;   // no wrap: frames past the loop continue the motion (for the seam cross-fade)
  const wa = wheelAngle(t);
  wheel.rotation.z = wa;
  gear2.rotation.z = -wa * (TEETH / 14) * 0.5 + 0.1;

  // pawl: rotate about pivot so its tip rides at R_ROOT + lift
  const lift = pawlLift(t);
  pawl.rotation.z = lift / pawlLen;

  // click flash + sparks
  const sc = sinceClick(t);
  const fl = Math.exp(-sc * 9);
  flash.material.opacity = fl; flash.scale.setScalar(0.4 + fl * 1.1);
  fill.intensity = fl * 18;
  for (let s = 0; s < SPARKS; s++) {
    const [vx, vy, vz, life] = sparkDir[s];
    const a = sc / life, alive = a < 1;
    const x = contact.x + vx * sc, y = contact.y + vy * sc - 2.2 * sc * sc, z = contact.z + vz * sc;
    const dt = 0.035;
    const px = contact.x + vx * (sc - dt), py = contact.y + vy * (sc - dt) - 2.2 * (sc - dt) ** 2, pz = contact.z + vz * (sc - dt);
    const o = s * 6;
    sparkPos.set([px, py, pz, x, y, z], o);
    const b = alive ? Math.pow(1 - a, 1.5) * 2.2 : 0;
    sparkCol.set([b * 1.0, b * 0.45, b * 0.12, b * 1.0, b * 0.75, b * 0.4], o);
  }
  sparkGeo.attributes.position.needsUpdate = sparkGeo.attributes.color.needsUpdate = true;

  // checkpoint studs: heat by how long ago they passed the pawl (world-space, seamless)
  for (let k = 0; k < TEETH; k++) {
    let wAng = studs[k] + wa;                 // world angle
    let d = ((PAWL_A - wAng) % TAU + TAU) % TAU;  // how far past the pawl (clockwise)
    d = TAU - d; if (d > TAU - 0.05) d = 0;       // 0 just locked, grows as it moves away
    const heat = d < 0.02 ? 0 : Math.exp(-d / 0.75);
    studMats[k].emissiveIntensity = heat > 0.04 ? heat * 7 : 0;
  }

  // dust
  for (let k = 0; k < DUST; k++) {
    const [x, y, z, o, amp, m] = dustBase[k];
    dustPos[k * 3] = x + Math.sin(ph * m + o) * amp;
    dustPos[k * 3 + 1] = y + Math.cos(ph * m + o * 1.3) * amp * 0.8;
    dustPos[k * 3 + 2] = z + Math.sin(ph + o * 0.7) * amp * 0.5;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // camera: slow periodic orbit + breathing dolly
  const az = 0.40 + Math.sin(ph) * 0.07, el = 0.16 + Math.cos(ph) * 0.035, dist = 11.6 + Math.sin(ph + 1) * 0.3;
  const target = new THREE.Vector3(0.45 + Math.sin(ph) * 0.05, 0.72, 0);
  camera.position.set(target.x + Math.sin(az) * dist * Math.cos(el), target.y + Math.sin(el) * dist, Math.cos(az) * dist * Math.cos(el));
  // shift the frame so the wheel sits right of center (room for the headline)
  camera.setViewOffset(W, H, -W * 0.25, 0, W, H);
  camera.lookAt(target);
  if (P.get('cam') === 'macro') {
    camera.clearViewOffset();
    camera.fov = 24; camera.updateProjectionMatrix();
    camera.position.set(contact.x + 2.6, contact.y + 0.9, 3.4);
    camera.lookAt(contact.x - 0.35, contact.y - 0.15, 0);
  }
  bokeh.uniforms.focus.value = camera.position.distanceTo(contact);
  if (P.get('cam') === 'macro') bokeh.uniforms.aperture.value = 0.006;
  composer.render();
};
window.FRAMES = FRAMES;
window.ready = true;
</script></body></html>
